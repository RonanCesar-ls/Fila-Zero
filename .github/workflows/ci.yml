name: Backend CI - FilaZero

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Dar permissão de execução para o Gradle
        run: chmod +x gradlew

      - name: Rodar o Build (Verificar se o código compila)
        run: ./gradlew build -x test